<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>paw-reader</title>
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div id="top-progress"></div>
  <!-- Navigation/Header -->
  <div id="nav" class="hidden">
    <button id="nav-back" class="hidden" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>
    <button id="nav-info" class="hidden" aria-label="Info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></button>
    <button id="nav-settings" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg></button>
    <button id="nav-home" aria-label="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></button>
    
    <div id="nav-tabs" class="hidden">
      <!-- Populated dynamically based on site -->
    </div>
  </div>

  <div id="zip-viewer" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2000; display: flex; flex-direction: column;">
    <div id="zip-nav" class="hidden-nav">
      <button id="close-zip-viewer" class="zip-nav-btn" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>
      <button id="zip-settings-viewer" class="zip-nav-btn" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg></button>
      <button id="zip-home-viewer" class="zip-nav-btn" aria-label="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></button>
    </div>
    <div id="zip-indicator" style="position: absolute; top: 20px; right: 20px; z-index: 2010; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px 12px; border-radius: 15px; font-size: 0.9rem; cursor: pointer; transition: transform 0.3s;">1 / 1</div>
    <div id="zip-title" style="display: none;"></div>
    <div id="zip-content" style="flex: 1; overflow-x: scroll; overflow-y: hidden; display: flex; scroll-snap-type: x mandatory; scrollbar-width: none; background: #000;">
      <!-- Extracted images go here -->
    </div>
  </div>
  
  <div id="settings-menu" style="transform: translateY(-50%) translateX(100%); visibility: hidden;">
    <h3>Settings</h3>
    <div id="settings-content">
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
        <span>Hide empty posts</span>
        <input type="checkbox" id="setting-hide-no-media" style="width: 18px; height: 18px; cursor: pointer;">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-top: 15px;">
        <span>Disable animations</span>
        <input type="checkbox" id="setting-disable-animations" style="width: 18px; height: 18px; cursor: pointer;">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-top: 15px;">
        <span>Auto-download ZIP files</span>
        <input type="checkbox" id="setting-auto-download-zip" style="width: 18px; height: 18px; cursor: pointer;">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-top: 15px;">
        <span>Hide cover images</span>
        <input type="checkbox" id="setting-hide-covers" style="width: 18px; height: 18px; cursor: pointer;">
      </label>
    </div>
  </div>

  <!-- Welcome Screen -->
  <div id="welcome-screen" class="view active">
    <h1>Welcome to Paw Reader!</h1>
    <p>What would you like to explore today?</p>
    <div class="site-selection" style="margin-bottom: 30px;">
      <label for="site-selector" style="color:#ccc; font-size:1.1rem; margin-right:10px;">Select Source:</label>
      <select id="site-selector" style="padding: 8px 12px; font-size: 1.1rem; border-radius: 8px; background: #121212; color: white; border: 1px solid #333; cursor: pointer; outline: none;">
        <option value="pawchive">Pawchive</option>
        <option value="kemono">Kemono (kemono.cr)</option>
        <option value="cum">Coomer (cum.st)</option>
      </select>
    </div>
    <div class="welcome-buttons">
      <button id="btn-latest">Latest Posts</button>
      <button id="btn-creators">Creator List</button>
    </div>
    
    <div class="nav-tips" style="margin-top: 40px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; max-width: 400px; text-align: center; color: #ccc;">
      <h3 style="margin-top: 0; color: #fff; font-size: 1.1rem;">💡 Navigation Tips</h3>
      <p style="margin: 10px 0 0; font-size: 0.95rem; line-height: 1.5;">
        <strong>Keyboard:</strong> Use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <strong>Arrow Keys</strong> to seamlessly flip through posts and media.<br><br>
        <strong>Touch:</strong> Swipe up/down for posts, and left/right for galleries.
      </p>
    </div>
  </div>

  <!-- Creators List View -->
  <div id="creators-view" class="view">
    <h2 id="creators-title">Creators</h2>
    <div class="creators-controls">
      <input type="text" id="creator-search" placeholder="Search creators...">
      <div id="creator-service-filter" class="checkbox-container">
        <!-- populated dynamically -->
      </div>
      <select id="creator-content-filter">
        <option value="content">With Content</option>
        <option value="all">All Profiles</option>
        <option value="empty">Empty Profiles</option>
      </select>

      <select id="creator-gender-filter" style="display: none;">
        <option value="all">All genders</option>
        <option value="woman">Woman</option>
        <option value="man">Man</option>
        <option value="trans_woman">Trans woman</option>
        <option value="trans_man">Trans man</option>
        <option value="non_binary">Non-binary</option>
        <option value="group">Group</option>
      </select>

      <select id="creator-sort">
        <option value="popularity">Popularity</option>
        <option value="indexed">Date Indexed</option>
        <option value="updated">Date Updated</option>
        <option value="alphabetical">Alphabetical Order</option>
        <option value="service">Service</option>
      </select>
      <button id="creator-sort-dir" title="Toggle sort direction" style="display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg></button>
    </div>
    <div id="creators-loading" class="loading active">Loading creators...</div>
    <div id="creators-list" class="creators-grid"></div>
    <div id="creator-pagination" class="pagination"></div>
  </div>

  <!-- Feed View -->
  <div id="feed-view" class="view">
    <div id="feed" class="feed vertical">
      <!-- Posts will be injected here -->
    </div>
    <div id="feed-loading" class="loading">Loading...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/unzipit@1.4.0/dist/unzipit.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
